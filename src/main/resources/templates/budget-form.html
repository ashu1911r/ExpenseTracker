<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title th:text="${pageTitle}">Budget</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header class="topbar"><div class="brand">💰 Expense Tracker</div><nav><a href="/">Dashboard</a><a href="/expenses">Expenses</a><a class="active" href="/budgets">Budgets</a></nav></header>
<main class="container narrow"><div class="panel form-panel"><p class="eyebrow">Planning</p><h1 th:text="${pageTitle}">Set Monthly Budget</h1>
<form th:action="@{/budgets/save}" th:object="${budget}" method="post">
<input type="hidden" th:field="*{id}">
<label>Year<input type="number" min="2000" th:field="*{budgetYear}" required><small class="error" th:errors="*{budgetYear}"></small></label>
<label>Month<select th:field="*{budgetMonth}" required><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select><small class="error" th:errors="*{budgetMonth}"></small></label>
<label>Budget Amount (₹)<input type="number" step="0.01" min="0.01" th:field="*{amount}" placeholder="10000.00" required><small class="error" th:errors="*{amount}"></small></label>
<div class="form-actions"><a class="btn" href="/budgets">Cancel</a><button class="btn primary" type="submit">Save Budget</button></div>
</form></div></main></body></html>
