<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title th:text="${pageTitle}">Expense</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header class="topbar"><div class="brand">💰 Expense Tracker</div><nav><a href="/">Dashboard</a><a class="active" href="/expenses">Expenses</a><a href="/budgets">Budgets</a></nav></header>
<main class="container narrow"><div class="panel form-panel"><p class="eyebrow">Transaction</p><h1 th:text="${pageTitle}">Add Expense</h1>
<form th:action="@{/expenses/save}" th:object="${expense}" method="post">
<input type="hidden" th:field="*{id}">
<label>Title<input type="text" th:field="*{title}" placeholder="e.g. Lunch" required><small class="error" th:errors="*{title}"></small></label>
<label>Amount (₹)<input type="number" step="0.01" min="0.01" th:field="*{amount}" placeholder="250.00" required><small class="error" th:errors="*{amount}"></small></label>
<label>Category
    <select th:field="*{category}" required>
        <option value="">Select category</option>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Bills">Bills</option>
        <option value="Other">Other</option>
    </select>
</label><label>Date<input type="date" th:field="*{expenseDate}" required><small class="error" th:errors="*{expenseDate}"></small></label>
<div class="form-actions"><a class="btn" href="/expenses">Cancel</a><button class="btn primary" type="submit">Save Expense</button></div>
</form></div></main></body></html>
